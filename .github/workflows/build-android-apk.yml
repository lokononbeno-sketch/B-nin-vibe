name: Build Bénin Vibe Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download generated APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p dist
          eas build:download --latest --platform android --output ./dist/benin-vibe.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: benin-vibe-android-apk
          path: dist/benin-vibe.apk
          if-no-files-found: error
          retention-days: 14
